name: Deploy portfolio to GitHub Pages

# Builds the developerFolio (CRA) app and deploys it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
# Optional: set a repo variable MEDIUM_USERNAME to auto-pull Medium blog posts
#           (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # weekly refresh of GitHub/Medium data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: false
      USE_GITHUB_DATA: "true"
      GITHUB_USERNAME: ${{ github.repository_owner }}
      REACT_APP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIUM_USERNAME: ${{ vars.MEDIUM_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
