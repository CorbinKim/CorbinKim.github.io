<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Edit meta tags for SEO -->
    <title>Corbin Kim | Portfolio</title>
    <meta
      name="title"

      content="Ph.D. Candidate at NextG Lab, NC State University. Researching LLM-driven wireless resource management in O-RAN toward fully autonomous Zero Touch Networks."

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://corbinkim.github.io/" />

      property="og:title"

      property="og:description"
      content="Ph.D. Candidate at NextG Lab, NC State University. Researching LLM-driven wireless resource management in O-RAN toward fully autonomous Zero Touch Networks."

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://corbinkim.github.io/" />
    <meta
      property="twitter:title"
      content="Corbin Kim | Ph.D. Candidate, NC State University"
    />
    <meta
      property="twitter:description"
      content="Ph.D. Candidate at NextG Lab, NC State University. Researching LLM-driven wireless resource management in O-RAN toward fully autonomous Zero Touch Networks."
    />

    <meta name="msapplication-TileColor" content="#1d1d1f" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Customize icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png?v8=qAJ44G5Bm7"
    />
    <link
      rel="icon"
      type="image/png"

      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Inter is the open-source fallback for SF Pro on non-Apple platforms.
         Apple devices resolve system-ui to the real SF Pro and ignore this. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script> -->

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/css/all.min.css"
    />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
